id: sqlite
kind: mcp
addon: true
tags:
- data
- science
summary: SQLite MCP on scratch DB path — no API key
homepage: ''
agents: [mcp-hosts]
install:
  type: mcp-snippet
  server: sqlite
  cursor:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-sqlite'
    - ${SCRATCH}/astroai-lab-mcp.sqlite
  opencode:
    type: local
    command:
    - npx
    - -y
    - '@modelcontextprotocol/server-sqlite'
    - ${SCRATCH}/astroai-lab-mcp.sqlite
    enabled: true
