id: git-mcp
kind: mcp
addon: true
tags:
- lean
- review
summary: Local git MCP (uvx mcp-server-git) — no API key
homepage: ''
agents: [mcp-hosts]
install:
  type: mcp-snippet
  server: git
  cursor:
    command: uvx
    args:
    - mcp-server-git
  opencode:
    type: local
    command:
    - uvx
    - mcp-server-git
    enabled: true
