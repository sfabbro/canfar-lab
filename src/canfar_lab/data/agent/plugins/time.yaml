id: time
kind: mcp
addon: true
tags:
- lean
summary: Timezone / time MCP — no API key
homepage: ''
agents: [mcp-hosts]
install:
  type: mcp-snippet
  server: time
  cursor:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-time'
  opencode:
    type: local
    command:
    - npx
    - -y
    - '@modelcontextprotocol/server-time'
    enabled: true
