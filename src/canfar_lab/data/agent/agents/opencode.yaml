# OpenCode (sst/opencode) — registry entry.
id: opencode
name: OpenCode Interpreter
homepage: https://github.com/sst/opencode
summary: Terminal AI coding assistant supporting local & cloud LLMs
binary: opencode
tags: [agent, cli, open]
install:
  method: curl
  source: https://opencode.ai/install
  env:
    XDG_BIN_DIR: "{bin_dir}" # hint; installer still hardcodes $HOME/.opencode/bin
  args:
    - --no-modify-path # do not append ~/.opencode/bin to .bashrc
  post_binary_paths:
    - "~/.opencode/bin/opencode"
config:
  path: "~/.config/opencode/opencode.json"
  format: jsonc
  provider_key: OPENROUTER_API_KEY
verify:
  - "opencode --version"
  - "test -f ~/.config/opencode/opencode.json"
plugins: [skill, mcp, config, addon]
notes: Configured via ~/.config/opencode/opencode.json
