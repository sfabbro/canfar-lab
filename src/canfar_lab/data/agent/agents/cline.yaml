# Cline CLI — registry entry.
id: cline
name: Cline CLI
homepage: https://github.com/cline/cline
summary: Autonomous coding agent CLI with tool use and safety checks
binary: cline
tags: [agent, cli]
install:
  method: npm
  source: cline@latest
config:
  path: "~/.config/cline/cline-notes.md"
  format: markdown
  provider_key: OPENROUTER_API_KEY
verify:
  - "cline --version"
  - "test -f ~/.config/cline/cline-notes.md"
plugins: [skill, mcp, config, addon]
notes: "Config notes under ~/.config/cline/; set OPENROUTER_API_KEY yourself"
